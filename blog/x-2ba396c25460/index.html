function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
async function openPage(pw) {
  var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  var key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256"},
                                          base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  var plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(P.iv)}, key, b64(P.data));
  return new TextDecoder().decode(plain);
}
document.getElementById("f").addEventListener("submit", async function (e) {
  e.preventDefault();
  var msg = document.getElementById("msg"); msg.textContent = "Opening...";
  try {
    var html = await openPage(document.getElementById("pw").value);
    document.open(); document.write(html); document.close();
  } catch (err) { msg.textContent = "Wrong password."; }
});
